[versions]
# Combinación verificada en los ejemplos oficiales de Google (android/compose-samples, nowinandroid), octubre 2026.
androidGradlePlugin = "9.3.2"
kotlin = "2.4.20"
compileSdk = "37"
targetSdk = "37"
minSdk = "29"
androidx-compose-bom = "2026.09.00"
androidx-activity-compose = "1.13.0"
androidx-core-ktx = "1.19.0"
junit = "4.13.2"
androidx-work = "2.12.0"
kotlinx-serialization = "1.11.0"
coroutines = "1.11.0"
room = "2.8.5"
ksp = "2.3.12"
robolectric = "4.17"
play-services-location = "21.3.0"
osmdroid = "6.1.20"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
